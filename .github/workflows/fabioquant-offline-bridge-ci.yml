name: FabioQuant offline bridge tests

on:
  push:
    branches:
      - research/fabioquant-data-news-offline-2026-11-01
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile offline adapter and synthetic tests
        run: python -m py_compile agents/fabioquant_offline.py tests/test_fabioquant_offline.py
      - name: Run bounded offline synthetic tests
        run: python -m unittest discover -s tests -p 'test_fabioquant_offline.py' -v
